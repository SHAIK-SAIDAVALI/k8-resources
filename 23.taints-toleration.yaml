apiVersion: v1
kind: Pod
metadata:
  name: pod-with-toleration
  namespace: roboshop
spec:
  nodeSelector:
    env: production
  tolerations:
    - key: "server"
      operator: "Equal"
      value: "database"
      effect: "NoSchedule"
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80